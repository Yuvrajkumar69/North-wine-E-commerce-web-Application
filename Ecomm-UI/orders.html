<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | North &amp; Vine</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>

  <body class="page-body">
    <nav class="site-nav">
      <div class="nav-inner">
        <a class="brand-mark" href="index.html">NORTH <span>&amp;</span> VINE</a>
        <ul class="nav-links">
          <li><a href="index.html">Continue Shopping</a></li>
          <li>
            <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
              <i class="fas fa-shopping-bag"></i>
              <span class="cart-badge">0</span>
            </a>
          </li>
          <li id="navAuthArea"><button class="link-btn" onclick="openAuth('login')">Sign In</button></li>
        </ul>
      </div>
    </nav>

    <div class="orders-wrap">
      <span class="eyebrow">Order history</span>
      <h1 class="page-title">My Orders</h1>
      <p class="page-sub" style="margin-bottom:28px;color:var(--text-soft);">Every order placed with this account.</p>

      <div id="orders-container">
        <div class="empty-state">Loading your orders&hellip;</div>
      </div>
    </div>

    <footer class="site-footer" style="margin-top:0;">
      <div class="shop-container">
        <div class="footer-bottom">
          &copy; 2026 <strong>North &amp; Vine</strong> &mdash; a portfolio project built on Spring Boot &amp; vanilla JS.
        </div>
      </div>
    </footer>

    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card-wrap">
        <div class="auth-card">
          <button class="auth-close" onclick="closeAuth()" aria-label="Close">&times;</button>
          <h3 id="authTitle">Sign in</h3>
          <p class="sub" id="authSub">Welcome back. Enter your details to continue.</p>
          <form id="authForm" onsubmit="return handleAuthSubmit(event)">
            <div class="field" id="nameField" style="display:none">
              <label for="authName">Full name</label>
              <input type="text" id="authName" autocomplete="name" />
            </div>
            <div class="field">
              <label for="authEmail">Email</label>
              <input type="email" id="authEmail" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="authPassword">Password</label>
              <input type="password" id="authPassword" autocomplete="current-password" required />
            </div>
            <div class="field-error" id="authError"></div>
            <button type="submit" class="btn-brass" id="authSubmitBtn" style="width:100%;justify-content:center;">Sign In</button>
          </form>
          <div class="auth-switch">
            <span id="authSwitchText">New here?</span>
            <button type="button" onclick="toggleAuthMode()" id="authSwitchBtn">Create an account</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
